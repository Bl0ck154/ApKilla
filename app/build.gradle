plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('APKILLA_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('APKILLA_KEYSTORE_PASSWORD')
def hasReleaseSigning = releaseKeystorePath != null && !releaseKeystorePath.trim().isEmpty()
        && releaseKeystorePassword != null && !releaseKeystorePassword.isEmpty()

android {
    namespace 'com.block154.apkilla'
    compileSdk 35

    defaultConfig {
        applicationId 'com.block154.apkilla'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.3.3'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias 'apkilla'
                keyPassword releaseKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
