name: Cleanup probe branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-probe-branches-20260819.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary probe branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in "release-probe-031" "release-probe-031b"; do
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          done
