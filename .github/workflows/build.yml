name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify debug build
        run: gradle :app:assembleDebug --stacktrace

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent signing key
        env:
          APKILLA_KEYSTORE_B64: ${{ secrets.APKILLA_KEYSTORE_B64 }}
          APKILLA_KEYSTORE_PASSWORD: ${{ secrets.APKILLA_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APKILLA_KEYSTORE_B64" ] || [ -z "$APKILLA_KEYSTORE_PASSWORD" ]; then
            echo "Missing release-signing repository secrets." >&2
            exit 1
          fi
          printf '%s' "$APKILLA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/apkilla-release.jks"

      - name: Build signed release APK
        env:
          APKILLA_KEYSTORE_PATH: ${{ runner.temp }}/apkilla-release.jks
          APKILLA_KEYSTORE_PASSWORD: ${{ secrets.APKILLA_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk ApKilla-0.3.1-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ApKilla-0.3.1-release
          path: ApKilla-0.3.1-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.3.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ApKilla-0.3.1-release.apk --clobber
          else
            gh release create "$TAG" ApKilla-0.3.1-release.apk --title "ApKilla 0.3.1" --notes "Signed release build using the permanent ApKilla signing certificate."
          fi

      - name: Persist signed APK result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/ApKilla-0.3.1-release.apk
            printf 'SUCCESS\n' > dist/release-build-status.txt
          else
            rm -f dist/ApKilla-0.3.1-release.apk
            printf 'FAILED\n' > dist/release-build-status.txt
          fi
          git add dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist signed ApKilla 0.3.1 build [skip ci]"
          git push
