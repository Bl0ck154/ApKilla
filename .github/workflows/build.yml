name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ApKilla-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Persist requested build result
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish apk]')
        shell: bash
        run: |
          mkdir -p dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/ApKilla-0.3.0-debug.apk
            rm -f dist/build-error.txt
            MESSAGE="Publish ApKilla 0.3.0 APK [skip ci]"
          else
            cp build.log dist/build-error.txt 2>/dev/null || echo "Build failed before Gradle produced a log." > dist/build-error.txt
            rm -f dist/ApKilla-0.3.0-debug.apk
            MESSAGE="Record ApKilla build failure [skip ci]"
          fi

          git add dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "$MESSAGE"
          git push
