name: Android checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

permissions:
  contents: read

concurrency:
  group: apkilla-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and compile debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
