name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ApKilla-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish requested APK build
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="ApKilla-0.3.0-debug.apk"
          TAG="apk-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" \
            --title "ApKilla 0.3.0 debug build" \
            --notes "Installable debug APK built automatically from commit $GITHUB_SHA."
