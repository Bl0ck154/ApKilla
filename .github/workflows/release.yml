name: Signed release APK

# Release only explicitly versioned tags. Never run signing/publishing from
# untrusted issues or pull requests; never overwrite an existing public APK.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

permissions:
  contents: write

concurrency:
  group: apkilla-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # QA artifacts can only be signed manually from the protected main branch.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify release version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.APKILLA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APKILLA_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/apkilla-release.jks"
      - name: Test and build signed APK
        env:
          APKILLA_KEYSTORE_PATH: ${{ runner.temp }}/apkilla-release.jks
          APKILLA_KEYSTORE_PASSWORD: ${{ secrets.APKILLA_KEYSTORE_PASSWORD }}
        shell: bash
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/signing.txt"
          grep -qi '9dcc58ef2da758659aa29861d6d7baacc17cfcdd970a07b5fc7455e1feac1cfa' "$RUNNER_TEMP/signing.txt"
      - name: Upload signed QA APK (manual builds only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ApKilla-signed-QA
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish immutable versioned APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its APK." >&2
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "ApKilla-${TAG#v}-release.apk"
          gh release create "$TAG" "ApKilla-${TAG#v}-release.apk" --verify-tag --title "ApKilla ${TAG#v}" --generate-notes
