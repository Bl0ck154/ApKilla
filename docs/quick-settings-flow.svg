<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-label="ApKilla: open an app, tap Kill app in Quick Settings, then Android confirms Force stop">
 <rect width="960" height="220" rx="18" fill="#111522"/>
 <g font-family="Arial,sans-serif" text-anchor="middle" fill="#e7edf5">
 <rect x="24" y="48" width="272" height="125" rx="16" fill="#1e293b" stroke="#556275"/>
 <text x="160" y="92" font-size="24" font-weight="bold">1. Use your app</text>
 <text x="160" y="124" font-size="16" fill="#a7b2c5">The current app is tracked</text>
 <path d="M314 110 h38 m-12 -10 l12 10 -12 10" stroke="#f66b69" fill="none" stroke-width="4"/>
 <rect x="368" y="48" width="250" height="125" rx="16" fill="#28374b" stroke="#f66b69"/>
 <text x="493" y="92" font-size="24" font-weight="bold">2. Kill app</text>
 <text x="493" y="124" font-size="16" fill="#a7b2c5">Quick Settings tile</text>
 <path d="M636 110 h38 m-12 -10 l12 10 -12 10" stroke="#f66b69" fill="none" stroke-width="4"/>
 <rect x="690" y="48" width="246" height="125" rx="16" fill="#1e293b" stroke="#556275"/>
 <text x="812" y="92" font-size="24" font-weight="bold">3. Android UI</text>
 <text x="812" y="124" font-size="16" fill="#a7b2c5">Force stop + confirm</text>
 </g>
 <text x="480" y="202" fill="#8b98ab" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">Illustration of the workflow, not a device screenshot</text>
</svg>
